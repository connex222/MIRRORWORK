<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12071F">
<meta name="description" content="Mirrorwork — a card-matching memory game with five procedurally drawn decks.">
<title>Mirrorwork — a memory game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232A1050'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23F0C35C' stroke-width='5'/><circle cx='50' cy='50' r='11' fill='%23F0C35C'/></svg>">
<style>
  :root{
    --ink:#F6F1FF; --dim:#B49BD8;
    --gold:#F0C35C; --gold-dim:rgba(240,195,92,.28);
    --serif:"Didot","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --gap:10px; --rail:460px; --radius:12px;
    --t-label:9.5px; --t-value:17px; --t-ui:11px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    padding:calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
            calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    font-family:var(--sans); color:var(--ink);
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    background:
      radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
      radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
      linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
    background-attachment:fixed;
  }
  button{font-family:inherit;color:inherit;touch-action:manipulation}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---- shell ------------------------------------------------------ */
  .shell{display:flex;flex-direction:column;align-items:center;gap:4px}
  .rail{width:100%;max-width:var(--rail)}
  .stage{width:100%;display:flex;justify-content:center}

  /* ---- header ----------------------------------------------------- */
  .head{position:relative;text-align:center;margin-bottom:12px}
  .eyebrow{margin:0 0 5px;font-size:var(--t-ui);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);opacity:.85}
  h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(32px,8vw,44px);letter-spacing:.05em;line-height:1;
     background:linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .icobtn{position:absolute;top:0;width:40px;height:40px;border-radius:50%;cursor:pointer;
     border:1px solid var(--gold-dim);background:rgba(255,255,255,.05);color:var(--gold);
     display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,opacity .2s}
  .icobtn:hover{background:var(--gold);color:#200D3A}
  .icobtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .icobtn svg{width:17px;height:17px}
  #sound{right:0}
  #pause{left:0}
  #sound.off{color:var(--dim);opacity:.65}
  #pause:disabled{opacity:.3;cursor:default}
  #pause:disabled:hover{background:rgba(255,255,255,.05);color:var(--gold)}

  /* ---- stats ------------------------------------------------------ */
  .stats{display:flex;align-items:center;gap:8px;margin-bottom:12px;
    padding:10px 12px;border:1px solid var(--gold-dim);border-radius:14px;background:rgba(255,255,255,.045)}
  .stat{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .k{font-size:var(--t-label);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .v{font-family:var(--mono);font-size:var(--t-value);font-variant-numeric:tabular-nums}
  .v i{font-style:normal;font-size:.72em;color:var(--dim)}
  #shuffle{flex:0 0 auto;font-size:var(--t-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    background:transparent;border:1px solid var(--gold-dim);border-radius:999px;padding:10px 14px;cursor:pointer;
    transition:background .2s,color .2s}
  #shuffle:hover{background:var(--gold);color:#200D3A}
  #shuffle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .chal[hidden]{display:none}
  .chal{display:flex;align-items:center;gap:9px;margin:0 0 12px;padding:10px 13px;border-radius:12px;
    border:1px solid rgba(240,195,92,.45);background:rgba(240,195,92,.1);text-align:left}
  .chal svg{width:16px;height:16px;flex:0 0 auto;color:var(--gold)}
  .chal span{font-size:var(--t-ui);letter-spacing:.06em;line-height:1.5}
  .chal b{display:block;font-weight:400;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:9.5px}

  /* ---- pickers ---------------------------------------------------- */
  .sizes{display:flex;gap:7px;margin-bottom:10px}
  .size{flex:1;min-height:46px;padding:8px 4px;border-radius:11px;cursor:pointer;font-size:12px;letter-spacing:.1em;
    color:var(--dim);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.2s}
  .size small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
  .size.on{border-color:var(--gold);background:rgba(240,195,92,.13);color:var(--ink)}
  .size:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .decks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .decks::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;width:84px;padding:9px 6px 8px;border-radius:14px;cursor:pointer;scroll-snap-align:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);transition:.2s}
  .chip:hover{transform:translateY(-2px)}
  .chip.on{border-color:var(--gold);background:rgba(240,195,92,.13);color:var(--ink)}
  .chip-art{width:30px;height:30px}
  .chip-art svg{width:100%;height:100%;display:block}
  .chip-name{font-size:var(--t-ui);letter-spacing:.08em}
  .pips{display:flex;gap:2.5px}
  .pips i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.2)}
  .pips i.on{background:var(--gold)}

  .opt{width:100%;margin-top:8px;min-height:44px;padding:10px 14px;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--dim);transition:.2s}
  .opt b{font-weight:400;font-size:12px;letter-spacing:.1em}
  .opt small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:2px}
  .opt .txt{text-align:left}
  .opt.on{border-color:var(--gold);background:rgba(240,195,92,.13);color:var(--ink)}
  .sw{flex:0 0 auto;width:36px;height:20px;border-radius:999px;background:rgba(255,255,255,.14);
    position:relative;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
    background:var(--dim);transition:transform .2s,background .2s}
  .opt.on .sw{background:rgba(240,195,92,.35)}
  .opt.on .sw::after{transform:translateX(16px);background:var(--gold)}
  .opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .note{margin:10px 0 0;text-align:center;font-size:var(--t-ui);letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);opacity:.6;line-height:1.7}

  /* ---- board ------------------------------------------------------ */
  .boardwrap{position:relative}
  #board{display:grid;gap:var(--gap);margin:0 auto}

  .scene{position:relative;aspect-ratio:3/4;padding:0;border:0;background:none;cursor:pointer;
    border-radius:var(--radius);perspective:1000px;contain:layout paint;
    touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .scene:disabled{cursor:default}
  .scene:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .card{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.85,.25,1)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face svg{width:100%;height:100%;display:block}
  .back{background:linear-gradient(150deg,#48227A 0%,#2A1050 55%,#1B0A35 100%);
    border:1px solid rgba(240,195,92,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 14px rgba(0,0,0,.4)}
  .front{transform:rotateY(180deg);padding:9%;
    background:radial-gradient(125% 120% at 28% 18%,#fff 0%,#F0E7FF 60%,#DFCFF7 100%);
    border:1px solid rgba(255,255,255,.55);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .ornament{aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;pointer-events:none;
    display:flex;align-items:center;justify-content:center;padding:7%;
    background:linear-gradient(150deg,#3A1A66 0%,#220D42 55%,#150829 100%);
    border:1px solid rgba(240,195,92,.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.45)}
  .ornament svg{width:100%;height:100%;display:block}
  #board.peek .card,#board.peekout .card{transition-delay:var(--d,0ms)}
  #board.peek .card{transform:rotateY(180deg)}
  .peekbar[hidden]{display:none}
  .peekbar{position:absolute;left:0;right:0;bottom:-11px;height:3px;border-radius:2px;
    background:rgba(240,195,92,.18);overflow:hidden;z-index:3}
  .peekbar i{display:block;height:100%;background:var(--gold);transform-origin:left center;
    transform:scaleX(1);transition:transform linear}

  .scene.matched{opacity:.9}
  .scene.matched .front{box-shadow:0 0 0 2px var(--gold),0 8px 26px rgba(240,195,92,.3);
    animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
  .scene.wrong .front{animation:shake .4s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}
    25%{transform:rotateY(180deg) translateX(-4px)}75%{transform:rotateY(180deg) translateX(4px)}}

  /* ---- pause veil -------------------------------------------------- */
  .veil[hidden]{display:none}
  .veil{position:absolute;inset:-8px;width:calc(100% + 16px);border:0;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;z-index:4;
    border-radius:18px;background:rgba(18,7,32,.72);backdrop-filter:blur(8px)}
  .veil span{font-family:var(--serif);font-size:22px;letter-spacing:.06em}
  .veil small{display:block;margin-top:6px;font-family:var(--sans);font-size:var(--t-ui);
    letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}

  /* ---- victory ----------------------------------------------------- */
  .win[hidden]{display:none}
  .win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(14,5,26,.82);backdrop-filter:blur(8px);animation:fade .35s ease both;z-index:20}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win-card{text-align:center;padding:28px 24px;max-width:330px;width:100%;
    border:1px solid var(--gold-dim);border-radius:18px;
    background:linear-gradient(180deg,rgba(74,29,122,.9),rgba(27,11,51,.94))}
  .seal{display:block;width:58px;height:58px;margin:0 auto 12px;animation:spin 16s linear infinite}
  .seal svg{width:100%;height:100%}
  @keyframes spin{to{transform:rotate(360deg)}}
  .win-card h2{margin:0 0 12px;font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.03em;color:#FFF3DC}
  .win-grid{display:flex;gap:6px;margin:0 0 14px}
  .win-grid div{flex:1;padding:9px 4px;border-radius:10px;background:rgba(255,255,255,.06)}
  .win-grid b{display:block;margin-top:3px;font-family:var(--mono);font-size:15px;font-weight:400}
  .win-best{margin:0 0 18px;font-size:var(--t-ui);letter-spacing:.06em;color:var(--gold);opacity:.9}
  .win-actions{display:flex;flex-direction:column;gap:9px}
  #again{width:100%;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:13px 28px;border-radius:999px;border:0;
    cursor:pointer;color:#22093C;background:linear-gradient(180deg,#FFE29A,#F0C35C);
    box-shadow:0 6px 20px rgba(240,195,92,.35);transition:transform .18s}
  #again:hover{transform:translateY(-2px)}
  #again:focus-visible{outline:2px solid #fff;outline-offset:3px}
  #share{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:12px 18px;border-radius:999px;
    cursor:pointer;color:var(--gold);background:transparent;border:1px solid var(--gold-dim);
    transition:background .2s,color .2s}
  #share:hover{background:var(--gold);color:#200D3A}
  #share:focus-visible{outline:2px solid #fff;outline-offset:3px}
  #share svg{width:16px;height:16px;flex:0 0 auto}
  .shared[hidden]{display:none}
  .shared{margin:10px 0 0;font-size:var(--t-ui);letter-spacing:.08em;color:var(--dim)}

  /* ---- wide: rail beside the board -------------------------------- */
  @media (min-width:900px){
    :root{--t-label:10px; --t-value:19px; --t-ui:12px;}
    body{padding:24px 28px;display:flex;align-items:center;justify-content:center}
    .shell{flex-direction:row;align-items:center;justify-content:center;gap:36px;width:100%;max-width:1180px}
    .rail{flex:0 0 340px;max-width:340px}
    .stage{flex:1 1 auto;min-width:0}
    .decks{flex-wrap:wrap;justify-content:center;overflow:visible}
    .chip{width:96px}
    h1{font-size:40px}
  }
  @media (min-width:1400px){
    :root{--t-value:21px;}
    .rail{flex:0 0 380px;max-width:380px}
    h1{font-size:46px}
  }

  /* ---- short landscape phones ------------------------------------- */
  @media (max-width:899px) and (orientation:landscape){
    .shell{flex-direction:row;align-items:center;gap:20px}
    .rail{flex:0 0 46%;max-width:340px}
    .stage{flex:1 1 auto;min-width:0}
    h1{font-size:26px}
    .note{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    .card{transition-duration:1ms}
    #board.peek .card,#board.peekout .card{transition-delay:0ms}
    .seal,.scene.matched .front,.scene.wrong .front,.win{animation:none}
    .chip:hover,#again:hover{transform:none}
  }
  @media (prefers-contrast:more){
    .chip,.size{border-color:rgba(255,255,255,.35)}
    .note{opacity:.9}
  }
</style>
</head>
<body>

<div class="shell">
  <div class="rail">
    <div class="head">
      <button class="icobtn" id="pause" disabled></button>
      <p class="eyebrow" id="eyebrow">Memory</p>
      <h1>Mirrorwork</h1>
      <button class="icobtn" id="sound"></button>
    </div>

    <p class="chal" id="chal" hidden></p>

    <div class="stats">
      <div class="stat"><span class="k">Time</span><span class="v" id="time">00:00</span></div>
      <div class="stat"><span class="k">Moves</span><span class="v" id="moves">00</span></div>
      <div class="stat"><span class="k">Found</span><span class="v" id="found">0<i>/8</i></span></div>
      <button id="shuffle">Shuffle</button>
    </div>

    <nav class="sizes" id="sizes" aria-label="Board size"></nav>
    <nav class="decks" id="decks" aria-label="Card style"></nav>
    <button class="opt" id="peekToggle" aria-pressed="false">
      <span class="txt"><b>Opening peek</b><small>Study the board before the clock starts</small></span>
      <i class="sw" aria-hidden="true"></i>
    </button>
    <p class="note" id="note"></p>
  </div>

  <div class="stage">
    <div class="boardwrap">
      <div id="board"></div>
      <div class="peekbar" id="peekbar" hidden aria-hidden="true"><i></i></div>
      <button class="veil" id="veil" hidden>
        <span>Paused<small>Tap to resume</small></span>
      </button>
    </div>
  </div>
</div>

<div class="win" id="win" hidden role="dialog" aria-modal="true" aria-label="Round complete">
  <div class="win-card">
    <span class="seal" id="seal" aria-hidden="true"></span>
    <h2>Every pair found</h2>
    <div class="win-grid">
      <div><span class="k">Time</span><b id="wTime">--</b></div>
      <div><span class="k">Moves</span><b id="wMoves">--</b></div>
      <div><span class="k">Accuracy</span><b id="wAcc">--</b></div>
    </div>
    <p class="win-best" id="winBest"></p>
    <div class="win-actions">
      <button id="again">Play again</button>
      <button id="share"></button>
    </div>
    <p class="shared" id="shared" hidden></p>
  </div>
</div>

<p class="sr-only" id="say" role="status" aria-live="polite"></p>

<script>
"use strict";

/* ---------------- decks & palettes ---------------- */

const DECKS = [
  { id:"signal",    name:"Signal",    complexity:1, blurb:"Solid discs" },
  { id:"facet",     name:"Facet",     complexity:2, blurb:"Cut polygons" },
  { id:"bloom",     name:"Bloom",     complexity:3, blurb:"Petal rosettes" },
  { id:"circuitry", name:"Circuitry", complexity:4, blurb:"Traced arms" },
  { id:"rosette",   name:"Rosette",   complexity:5, blurb:"Layered mandalas" }
];

const PALETTES = {
  signal:    ["#FF3D8B","#22D3EE","#A3E635","#FF8A3D","#A855F7","#2DD4BF","#FACC15","#F43F5E","#38BDF8","#FB7185","#4ADE80","#C084FC"],
  facet:     ["#FF6B6B","#4ECDC4","#FFD93D","#6C5CE7","#00D2FF","#FF9F1C","#B4F461","#F72585","#2EC4B6","#E4572E","#9B5DE5","#00BBF9"],
  bloom:     ["#FF7AA2","#FFB86B","#7DE2D1","#C99BFF","#8AD1FF","#FFE066","#FF6F91","#9BF6B0","#FFA5AB","#B8E0D2","#D8B4FE","#FFC9A9"],
  circuitry: ["#00F5D4","#FEE440","#FF006E","#8338EC","#3A86FF","#FB5607","#06D6A0","#EF476F","#7BF1A8","#FFD166","#4CC9F0","#F15BB5"],
  rosette:   ["#F72585","#7209B7","#4361EE","#4CC9F0","#F77F00","#06D6A0","#FFBE0B","#B5179E","#3A0CA3","#FF5400","#00BBF9","#80ED99"]
};

const SIZES = [
  { n:4, label:"4 × 4", cards:16, pairs:8,  ornament:false, gap:10 },
  { n:5, label:"5 × 5", cards:25, pairs:12, ornament:true,  gap:9  },
  { n:6, label:"6 × 6", cards:36, pairs:18, ornament:false, gap:7  }
];

const MIN_CELL = 40;    // never shrink a tap target below this
const MAX_CELL = 150;   // and never blow the cards up on a big monitor

/* ---------------- svg face generators ---------------- */

const poly = (n,r,cx,cy,rot) => {
  cx = cx===undefined?50:cx; cy = cy===undefined?50:cy; rot = rot===undefined?-90:rot;
  const out = [];
  for (let k=0;k<n;k++){
    const a = (rot + k*360/n) * Math.PI/180;
    out.push((cx + r*Math.cos(a)).toFixed(2) + "," + (cy + r*Math.sin(a)).toFixed(2));
  }
  return out.join(" ");
};

function rngFrom(seed){
  let t = seed + 0x6D2B79F5;
  return function(){
    t = Math.imul(t ^ t>>>15, t|1);
    t ^= t + Math.imul(t ^ t>>>7, t|61);
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

function faceArt(deckId, i){
  const pal = PALETTES[deckId];
  const c1 = pal[i % 12], c2 = pal[(i+4) % 12], c3 = pal[(i+7) % 12];
  let s = "";

  if (deckId === "signal"){
    const ring = Math.floor(i/12) % 2 === 1;
    s += '<circle cx="50" cy="50" r="39" fill="none" stroke="'+c1+'" stroke-opacity=".28" stroke-width="2.5"/>';
    s += ring
      ? '<circle cx="50" cy="50" r="23" fill="none" stroke="'+c1+'" stroke-width="13"/>'
      : '<circle cx="50" cy="50" r="29" fill="'+c1+'"/>';
    return s;
  }

  if (deckId === "facet"){
    const n = 3 + (i % 8);
    const alt = Math.floor(i/8) % 3;
    s += '<polygon points="'+poly(n,35)+'" fill="'+c1+'"/>';
    if (alt === 1) s += '<polygon points="'+poly(n,20,50,50,-90+180/n)+'" fill="'+c2+'"/>';
    s += '<polygon points="'+poly(n, alt===2?24:19, 50,50, -90+180/n)+'" fill="none" stroke="#241041" stroke-opacity=".42" stroke-width="2.6" stroke-linejoin="round"/>';
    return s;
  }

  if (deckId === "bloom"){
    const petals = 4 + (i % 7);
    const layers = 1 + Math.floor(i/7) % 3;
    for (let k=0;k<petals;k++)
      s += '<ellipse cx="50" cy="27" rx="9" ry="20" fill="'+c1+'" opacity=".92" transform="rotate('+(k*360/petals)+' 50 50)"/>';
    if (layers > 1) for (let k=0;k<petals;k++)
      s += '<ellipse cx="50" cy="38" rx="5.5" ry="12" fill="'+c2+'" opacity=".9" transform="rotate('+(k*360/petals + 180/petals)+' 50 50)"/>';
    if (layers > 2) for (let k=0;k<petals;k++)
      s += '<ellipse cx="50" cy="44" rx="3" ry="7" fill="'+c3+'" opacity=".95" transform="rotate('+(k*360/petals)+' 50 50)"/>';
    s += '<circle cx="50" cy="50" r="'+(layers>2?7:10)+'" fill="'+(layers>1?c3:c2)+'"/>';
    return s;
  }

  if (deckId === "circuitry"){
    const arms = 3 + (i % 5);
    const r = rngFrom(i*7919 + 13);
    const a = 13 + r()*9, b = 9 + r()*13, c = 29 + r()*13;
    const flip = r() > .5 ? -1 : 1;
    const d = "M50 50 V"+(50-a).toFixed(1)+" H"+(50+b*flip).toFixed(1)+" V"+(50-c).toFixed(1);
    s += '<circle cx="50" cy="50" r="43" fill="none" stroke="'+c1+'" stroke-opacity=".25" stroke-width="1.6"/>';
    for (let k=0;k<arms;k++){
      s += '<g transform="rotate('+(k*360/arms)+' 50 50)">';
      s += '<path d="'+d+'" fill="none" stroke="'+c1+'" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>';
      s += '<circle cx="'+(50+b*flip)+'" cy="'+(50-c)+'" r="4.4" fill="'+c2+'"/>';
      s += '<circle cx="50" cy="'+(50-a)+'" r="2.4" fill="'+c2+'" opacity=".85"/>';
      s += '</g>';
    }
    s += '<circle cx="50" cy="50" r="6" fill="'+c1+'"/><circle cx="50" cy="50" r="2.4" fill="#fff" opacity=".85"/>';
    return s;
  }

  const outerN = 8 + (i % 10), midN = 5 + (i % 5), innerN = 3 + (i % 6);
  for (let k=0;k<outerN;k++){
    const ang = (k*360/outerN - 90) * Math.PI/180;
    s += '<circle cx="'+(50+44*Math.cos(ang)).toFixed(2)+'" cy="'+(50+44*Math.sin(ang)).toFixed(2)+'" r="2.7" fill="'+c2+'"/>';
  }
  s += '<circle cx="50" cy="50" r="37" fill="none" stroke="'+c3+'" stroke-opacity=".5" stroke-width="1.2"/>';
  for (let k=0;k<midN;k++)
    s += '<ellipse cx="50" cy="27" rx="6.5" ry="14" fill="'+c1+'" opacity=".92" transform="rotate('+(k*360/midN)+' 50 50)"/>';
  for (let k=0;k<midN;k++)
    s += '<ellipse cx="50" cy="36" rx="3.4" ry="8" fill="'+c3+'" opacity=".85" transform="rotate('+(k*360/midN + 180/midN)+' 50 50)"/>';
  s += '<polygon points="'+poly(innerN,13)+'" fill="'+c3+'"/>';
  s += '<polygon points="'+poly(innerN,13,50,50,-90+180/innerN)+'" fill="'+c1+'" opacity=".55"/>';
  s += '<circle cx="50" cy="50" r="3.6" fill="#FFF8E6"/>';
  return s;
}

const svgWrap = inner => '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">'+inner+'</svg>';

function backArt(){
  let s = "";
  [43,35,27,19].forEach((r,k) => {
    s += '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="#E8B84B" stroke-width="'+(k%2?0.7:1.1)+'" stroke-opacity="'+(0.32+k*0.06)+'"/>';
  });
  for (let k=0;k<12;k++)
    s += '<line x1="50" y1="7" x2="50" y2="19" stroke="#E8B84B" stroke-opacity=".3" stroke-width=".9" transform="rotate('+(k*30)+' 50 50)"/>';
  s += '<polygon points="'+poly(4,9)+'" fill="none" stroke="#E8B84B" stroke-opacity=".75" stroke-width="1.2"/>';
  s += '<circle cx="50" cy="50" r="2.6" fill="#E8B84B" fill-opacity=".8"/>';
  return s;
}

function ornamentArt(){
  let s = "";
  s += '<rect x="7" y="7" width="86" height="86" rx="7" fill="none" stroke="#E8B84B" stroke-opacity=".55" stroke-width="1.5"/>';
  s += '<rect x="13" y="13" width="74" height="74" rx="5" fill="none" stroke="#E8B84B" stroke-opacity=".25" stroke-width=".8"/>';
  s += '<polygon points="'+poly(4,33)+'" fill="none" stroke="#E8B84B" stroke-opacity=".5" stroke-width="1.1"/>';
  s += '<polygon points="'+poly(4,33,50,50,-45)+'" fill="none" stroke="#E8B84B" stroke-opacity=".5" stroke-width="1.1"/>';
  s += '<circle cx="50" cy="50" r="24" fill="none" stroke="#E8B84B" stroke-opacity=".3" stroke-width=".8"/>';
  [[20,20,0],[80,20,90],[80,80,180],[20,80,270]].forEach(function(p){
    s += '<path d="M0 7 Q0 0 7 0" fill="none" stroke="#E8B84B" stroke-opacity=".6" stroke-width="1.4" transform="translate('+p[0]+' '+p[1]+') rotate('+p[2]+')"/>';
  });
  s += '<polygon points="'+poly(4,12)+'" fill="#E8B84B" fill-opacity=".85"/>';
  s += '<polygon points="'+poly(4,12,50,50,-45)+'" fill="#E8B84B" fill-opacity=".4"/>';
  s += '<circle cx="50" cy="50" r="4" fill="#1B0A35"/>';
  return s;
}

/* ---------------- sound ---------------- */

const Sound = (function(){
  let ctx = null, muted = false;
  try { muted = localStorage.getItem("mirrorwork.muted") === "1"; } catch(e){}

  function ac(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function note(freq, start, dur, opts){
    const c = ac(); if (!c) return;
    opts = opts || {};
    const t0 = c.currentTime + start;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = opts.type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.to) osc.frequency.exponentialRampToValueAtTime(opts.to, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(opts.gain || 0.07, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  const play = {
    flip:   () => note(760, 0, 0.09, { type:"triangle", to:520, gain:0.05 }),
    match:  () => { note(659,0,0.16,{gain:0.07}); note(988,0.07,0.24,{gain:0.055}); },
    miss:   () => { note(196,0,0.16,{type:"triangle",gain:0.06}); note(185,0.05,0.2,{type:"triangle",gain:0.05}); },
    win:    () => { [523,659,784,1047,1319].forEach((f,k)=>note(f,k*0.1,0.5,{gain:0.06})); note(262,0,1.2,{type:"triangle",gain:0.03}); },
    deal:   () => { for(let k=0;k<4;k++) note(420+k*90, k*0.05, 0.08, {type:"triangle",gain:0.035}); },
    toggle: () => note(440, 0, 0.12, { type:"triangle", gain:0.045 })
  };

  return {
    fire(name){
      if (muted) return;
      if (!ctx && (name === "deal" || name === "toggle")) return;
      const f = play[name]; if (f) try { f(); } catch(e){}
    },
    toggle(){
      muted = !muted;
      try { localStorage.setItem("mirrorwork.muted", muted ? "1" : "0"); } catch(e){}
      if (!muted) { ac(); this.fire("flip"); }
      return muted;
    },
    get muted(){ return muted; },
    warm(){ if (!muted) ac(); }
  };
})();

/* ---------------- state ---------------- */

const el = id => document.getElementById(id);
const board = el("board");

let deckId = "bloom", sizeN = 4;
let cards = [], nodes = new Map();
let flipped = [], matched = new Set();
let moves = 0, hits = 0;
let startedAt = null, elapsed = 0, won = false, paused = false;
let pending = null, tick = null;
let peekOn = false, peeking = false, peekTimers = [];
let seed = 0, pendingSeed = null, challenge = null;

/* A board is fully described by deck + size + peek + shuffle seed, so a short
   code in the URL hash lets two people play the identical deal.
   #g=<deckIndex><size><peek>-<seed36>[-<seconds36>-<moves36>]                */
function readChallenge(){
  const m = /#g=([0-4])([456])([01])-([0-9a-z]+)(?:-([0-9a-z]+)-([0-9a-z]+))?/i.exec(location.hash);
  if (!m) return null;
  const c = {
    deck: DECKS[+m[1]].id,
    size: +m[2],
    peek: m[3] === "1",
    seed: parseInt(m[4], 36) >>> 0,
    time: m[5] ? parseInt(m[5], 36) * 1000 : null,
    moves: m[6] ? parseInt(m[6], 36) : null
  };
  return isNaN(c.seed) ? null : c;
}

function boardCode(withResult){
  const d = DECKS.findIndex(x => x.id === deckId);
  let code = "#g=" + d + sizeN + (peekOn ? "1" : "0") + "-" + seed.toString(36);
  if (withResult) code += "-" + Math.floor(elapsed/1000).toString(36) + "-" + moves.toString(36);
  return code;
}

function boardLink(withResult){
  if (location.protocol !== "http:" && location.protocol !== "https:") return null;
  return location.origin + location.pathname + location.search + boardCode(withResult);
}

let best = {};
try { best = JSON.parse(localStorage.getItem("mirrorwork.best") || "{}"); } catch(e){ best = {}; }
try {
  const saved = JSON.parse(localStorage.getItem("mirrorwork.prefs") || "{}");
  if (saved.deck && DECKS.some(d => d.id === saved.deck)) deckId = saved.deck;
  if (saved.size && SIZES.some(s => s.n === saved.size)) sizeN = saved.size;
  if (typeof saved.peek === "boolean") peekOn = saved.peek;
} catch(e){}

challenge = readChallenge();
if (challenge){
  deckId = challenge.deck;
  sizeN  = challenge.size;
  peekOn = challenge.peek;
  pendingSeed = challenge.seed;   // consumed by the first newGame()
}

const sizeInfo = () => SIZES.find(s => s.n === sizeN);
const deckInfo = () => DECKS.find(d => d.id === deckId);
const bestKey  = () => deckId + ":" + sizeN + (peekOn ? ":peek" : "");

const clock = ms => {
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
};

const savePrefs = () => {
  try { localStorage.setItem("mirrorwork.prefs", JSON.stringify({deck:deckId, size:sizeN, peek:peekOn})); } catch(e){}
};

const say = msg => { el("say").textContent = msg; };

/* a queued flip-back or match settle, resolvable early by the next tap */
function schedule(fn, ms){
  pending = { fn: fn, id: setTimeout(() => { pending = null; fn(); }, ms) };
}
function resolveNow(){
  if (!pending) return;
  clearTimeout(pending.id);
  const fn = pending.fn;
  pending = null;
  fn();
}

/* ---------------- board fitting ---------------- */

let fitQueued = false;
function fitBoard(){
  fitQueued = false;
  const info = sizeInfo();
  const stage = document.querySelector(".stage");
  const avail = stage.clientWidth;
  if (!avail) return;

  const gaps = info.gap * (info.n - 1);
  const byWidth = (avail - gaps) / info.n;

  // vertical room left below the board's top edge
  const top = board.getBoundingClientRect().top;
  const bottomPad = parseFloat(getComputedStyle(document.body).paddingBottom) || 18;
  const room = window.innerHeight - top - bottomPad;
  // cards are 3:4, so cell height = cell width x 4/3
  const byHeight = room > 120 ? ((room - gaps) / info.n) * 0.75 : Infinity;

  const cell = Math.min(MAX_CELL, Math.max(MIN_CELL, Math.min(byWidth, byHeight)));
  board.style.width = Math.floor(cell * info.n + gaps) + "px";
}
function queueFit(){
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(fitBoard);
}

/* ---------------- build & render ---------------- */

function buildDeck(){
  const info = sizeInfo();
  const rnd = rngFrom(seed);
  const list = [];
  for (let i=0;i<info.pairs;i++) list.push({uid:i+"a", i:i}, {uid:i+"b", i:i});
  for (let k=list.length-1;k>0;k--){
    const j = Math.floor(rnd()*(k+1));
    const t = list[k]; list[k] = list[j]; list[j] = t;
  }
  if (info.ornament) list.splice(Math.floor(info.cards/2), 0, {uid:"medallion", ornament:true});
  return list;
}

function renderBoard(){
  const info = sizeInfo();
  document.documentElement.style.setProperty("--gap", info.gap + "px");
  board.style.gridTemplateColumns = "repeat(" + info.n + ", 1fr)";
  const backSvg = svgWrap(backArt());
  board.innerHTML = cards.map((c, idx) => {
    // diagonal sweep: cards nearer the top-left turn first
    const d = (Math.floor(idx / info.n) + (idx % info.n)) * 22;
    if (c.ornament)
      return '<div class="ornament" role="presentation">'+svgWrap(ornamentArt())+'</div>';
    return '<button class="scene" data-uid="'+c.uid+'" aria-label="Face-down card">'
      + '<span class="card" style="--d:'+d+'ms">'
      + '<span class="face back">'+backSvg+'</span>'
      + '<span class="face front">'+svgWrap(faceArt(deckId, c.i))+'</span>'
      + '</span></button>';
  }).join("");

  nodes.clear();
  board.querySelectorAll(".scene").forEach(n => nodes.set(n.dataset.uid, n));
  queueFit();
}

/* touch only the card that changed */
function paintCard(c){
  const node = nodes.get(c.uid);
  if (!node) return;
  const isMatched = matched.has(c.uid);
  const up = isMatched || flipped.indexOf(c.uid) > -1;
  node.firstElementChild.classList.toggle("flipped", up);
  node.classList.toggle("matched", isMatched);
  node.disabled = isMatched || won || paused || peeking;
  node.setAttribute("aria-label", up
    ? deckInfo().name + " " + (c.i + 1) + (isMatched ? ", matched" : "")
    : "Face-down card");
}
function paintCards(){ cards.forEach(c => { if (!c.ornament) paintCard(c); }); }

function paintStats(){
  const info = sizeInfo();
  el("time").textContent = clock(elapsed);
  el("moves").textContent = String(moves).padStart(2,"0");
  el("found").innerHTML = (matched.size/2) + "<i>/" + info.pairs + "</i>";
  el("eyebrow").textContent = peeking
    ? "Memorise"
    : "Memory · " + info.pairs + " pairs" + (peekOn ? " · peek" : "");
  el("note").textContent = deckInfo().blurb + " — complexity " + deckInfo().complexity + " of 5.";
  el("pause").disabled = startedAt === null || won || peeking;
  el("peekToggle").classList.toggle("on", peekOn);
  el("peekToggle").setAttribute("aria-pressed", String(peekOn));
}

function renderChips(){
  el("sizes").innerHTML = SIZES.map(s =>
    '<button class="size'+(s.n===sizeN?" on":"")+'" data-size="'+s.n+'" aria-pressed="'+(s.n===sizeN)+'">'
    + s.label + '<small>' + s.pairs + ' pairs</small></button>'
  ).join("");

  el("decks").innerHTML = DECKS.map(d =>
    '<button class="chip'+(d.id===deckId?" on":"")+'" data-deck="'+d.id+'" aria-pressed="'+(d.id===deckId)+'">'
    + '<span class="chip-art">'+svgWrap(faceArt(d.id, d.id==="facet"?4:2))+'</span>'
    + '<span class="chip-name">'+d.name+'</span>'
    + '<span class="pips" aria-label="complexity '+d.complexity+' of 5">'
    + [1,2,3,4,5].map(p => '<i class="'+(p<=d.complexity?"on":"")+'"></i>').join("")
    + '</span></button>'
  ).join("");
}

/* ---------------- opening peek ---------------- */

function clearPeek(){
  peekTimers.forEach(clearTimeout);
  peekTimers = [];
  peeking = false;
  board.classList.remove("peek", "peekout");
  el("peekbar").hidden = true;
  el("peekbar").firstElementChild.style.transition = "none";
  el("peekbar").firstElementChild.style.transform = "scaleX(1)";
}

function runPeek(){
  const info = sizeInfo();
  const hold = 1100 + info.pairs * 95;              // 8 pairs ≈ 1.9s, 18 pairs ≈ 2.8s
  const sweep = (info.n - 1) * 2 * 22 + 500;        // last card to finish turning
  peeking = true;
  paintCards();                                     // locks the board while it runs

  const bar = el("peekbar"), fill = bar.firstElementChild;
  bar.hidden = false;
  fill.style.transition = "none";
  fill.style.transform = "scaleX(1)";

  board.classList.add("peek");
  peekTimers.push(setTimeout(() => {
    fill.style.transition = "transform " + hold + "ms linear";
    fill.style.transform = "scaleX(0)";
  }, 30));

  peekTimers.push(setTimeout(endPeek, hold + sweep));
  paintStats();
}

function endPeek(){
  if (!peeking) return;
  peekTimers.forEach(clearTimeout);
  peekTimers = [];
  const sweep = (sizeInfo().n - 1) * 2 * 22 + 520;
  el("peekbar").hidden = true;
  board.classList.remove("peek");
  board.classList.add("peekout");
  Sound.fire("toggle");
  peekTimers.push(setTimeout(() => {
    board.classList.remove("peekout");
    peeking = false;
    paintCards();
    paintStats();
  }, sweep));
}

/* ---------------- game flow ---------------- */

function newGame(){
  if (pending) { clearTimeout(pending.id); pending = null; }
  if (tick) { clearInterval(tick); tick = null; }
  clearPeek();

  if (pendingSeed !== null){
    seed = pendingSeed;              // playing someone else's board
    pendingSeed = null;
  } else {
    seed = (Math.random() * 4294967296) >>> 0;
    challenge = null;                // a fresh deal ends any challenge
  }
  cards = buildDeck();
  flipped = []; matched = new Set();
  moves = 0; hits = 0; elapsed = 0; startedAt = null;
  won = false; paused = false;
  el("win").hidden = true;
  el("veil").hidden = true;
  el("pause").innerHTML = ICON_PAUSE;
  el("pause").setAttribute("aria-label", "Pause game");
  renderChips();
  renderBoard();
  paintCards();
  paintStats();
  paintChallenge();
  Sound.fire("deal");
  syncUrl();
  if (peekOn) runPeek();
}

/* the address bar always describes the board on screen, so a refresh
   (or a copied URL) replays exactly what you're looking at */
function syncUrl(){
  try { history.replaceState(null, "", location.pathname + location.search + boardCode(false)); }
  catch(e){}
}

const target = () => (challenge && challenge.time && challenge.seed === seed) ? challenge : null;

function paintChallenge(){
  const t = target();
  const n = el("chal");
  n.hidden = !t;
  if (t) n.innerHTML = ICON_FLAG
    + '<span><b>A friend\u2019s board</b>Beat ' + clock(t.time) + ' in ' + t.moves + ' moves</span>';
}

function startTimer(){
  startedAt = Date.now() - elapsed;
  if (tick) clearInterval(tick);
  tick = setInterval(() => {
    if (won || paused) return;
    elapsed = Date.now() - startedAt;
    el("time").textContent = clock(elapsed);
  }, 200);
}

function setPaused(on){
  if (won || peeking || startedAt === null || on === paused) return;
  paused = on;
  if (paused){
    if (tick) { clearInterval(tick); tick = null; }
    elapsed = Date.now() - startedAt;
  } else {
    startTimer();
  }
  el("veil").hidden = !paused;
  el("pause").innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  el("pause").setAttribute("aria-label", paused ? "Resume game" : "Pause game");
  paintCards();
  paintStats();
  Sound.fire("toggle");
}

function onFlip(uid){
  if (won || paused || peeking) return;
  resolveNow();                       // a third tap settles the previous turn at once

  const card = cards.find(c => c.uid === uid);
  if (!card || matched.has(uid) || flipped.indexOf(uid) > -1) return;

  Sound.warm();
  if (startedAt === null) { startTimer(); paintStats(); }
  Sound.fire("flip");

  flipped.push(uid);
  paintCard(card);
  if (flipped.length < 2) return;

  moves++;
  const a = cards.find(c => c.uid === flipped[0]);
  const b = cards.find(c => c.uid === flipped[1]);

  if (a.i === b.i){
    hits++;
    Sound.fire("match");
    schedule(() => {
      matched.add(a.uid); matched.add(b.uid);
      flipped = [];
      paintCard(a); paintCard(b);
      paintStats();
      say("Match. " + (matched.size/2) + " of " + sizeInfo().pairs + " found.");
      if (matched.size === sizeInfo().pairs * 2) finish();
    }, 460);
  } else {
    Sound.fire("miss");
    [a,b].forEach(c => {
      const n = nodes.get(c.uid);
      if (n){ n.classList.add("wrong"); setTimeout(() => n.classList.remove("wrong"), 420); }
    });
    schedule(() => {
      flipped = [];
      paintCard(a); paintCard(b);
    }, 900);
  }
  paintStats();
}

function finish(){
  won = true;
  if (tick) { clearInterval(tick); tick = null; }
  elapsed = startedAt ? Date.now() - startedAt : 0;
  Sound.fire("win");

  const acc = moves ? Math.round(hits / moves * 100) : 100;
  const key = bestKey(), prev = best[key];
  const better = !prev || elapsed < prev.time || (elapsed === prev.time && moves < prev.moves);
  if (better){
    best[key] = { time: elapsed, moves: moves };
    try { localStorage.setItem("mirrorwork.best", JSON.stringify(best)); } catch(e){}
  }

  el("seal").innerHTML = svgWrap(faceArt(deckId, 0));
  el("wTime").textContent  = clock(elapsed);
  el("wMoves").textContent = moves;
  el("wAcc").textContent   = acc + "%";
  const t = target();
  if (t){
    const diff = t.time - elapsed;
    const gap = Math.abs(Math.round(diff/1000));
    const pretty = gap >= 60 ? Math.floor(gap/60) + "m " + (gap % 60) + "s" : gap + "s";
    el("winBest").textContent = diff > 0
      ? "You beat their board by " + pretty + "."
      : (diff === 0 ? "Dead level with their time." : pretty + " short of their " + clock(t.time) + ".");
  } else {
    el("winBest").textContent = better
      ? "New best on " + deckInfo().name + " " + sizeInfo().label + (peekOn ? " with peek." : ".")
      : "Best here: " + clock(best[key].time) + " in " + best[key].moves + " moves";
  }
  el("shared").hidden = true;
  el("shared").textContent = "";
  el("win").hidden = false;
  paintCards();
  paintStats();
  say("Round complete in " + clock(elapsed) + " and " + moves + " moves.");
  el("again").focus();
}

/* ---------------- icons ---------------- */

const SVGATTR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICON_ON    = '<svg '+SVGATTR+'><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF   = '<svg '+SVGATTR+'><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
const ICON_PAUSE = '<svg '+SVGATTR+'><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg>';
const ICON_PLAY  = '<svg '+SVGATTR+'><polygon points="7 4 20 12 7 20 7 4"/></svg>';
const ICON_FLAG  = '<svg '+SVGATTR+'><path d="M4 21V4"/><path d="M4 4h11l-1.5 3.5L15 11H4"/></svg>';
const ICON_CHAT  = '<svg '+SVGATTR+'><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8.8 9.2c0 3 2.2 5.2 5.2 5.2"/></svg>';

function paintSound(){
  const b = el("sound");
  b.innerHTML = Sound.muted ? ICON_OFF : ICON_ON;
  b.classList.toggle("off", Sound.muted);
  b.setAttribute("aria-label", Sound.muted ? "Turn sound on" : "Turn sound off");
}

/* ---------------- sharing ---------------- */

function shareText(){
  const acc = moves ? Math.round(hits / moves * 100) : 100;
  const link = boardLink(true);
  const lines = [
    "Mirrorwork — " + sizeInfo().label + ", " + deckInfo().name + " deck"
      + (peekOn ? " (with peek)" : ""),
    clock(elapsed) + " · " + moves + " moves · " + acc + "% accuracy",
    link ? "Same cards, same shuffle — your turn:" : "Think you can beat that?"
  ];
  if (link) lines.push(link);
  return lines.join("\n");
}

function shareResult(){
  const text = shareText();
  const url = "https://wa.me/?text=" + encodeURIComponent(text);
  const win = window.open(url, "_blank", "noopener");
  if (win) { note(""); return; }

  // pop-up blocked — put it on the clipboard instead
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(() => note("Result copied. Paste it into a chat."))
      .catch(() => note("Couldn't open WhatsApp. Copy your time from above."));
  } else {
    note("Couldn't open WhatsApp. Copy your time from above.");
  }
  function note(msg){
    const n = el("shared");
    n.textContent = msg;
    n.hidden = !msg;
  }
}

/* ---------------- input ---------------- */

board.addEventListener("click", e => {
  if (peeking) { endPeek(); return; }          // tap anywhere to start early
  const btn = e.target.closest(".scene");
  if (btn) onFlip(btn.dataset.uid);
});

board.addEventListener("keydown", e => {
  const info = sizeInfo();
  const step = { ArrowRight:1, ArrowLeft:-1, ArrowDown:info.n, ArrowUp:-info.n }[e.key];
  if (step === undefined) return;
  const kids = Array.from(board.children);
  const active = document.activeElement.closest ? document.activeElement.closest(".scene") : null;
  const here = kids.indexOf(active);
  if (here < 0) return;
  e.preventDefault();
  let t = here + step;
  while (t >= 0 && t < kids.length && !(kids[t].matches(".scene") && !kids[t].disabled)) t += step;
  if (t >= 0 && t < kids.length) kids[t].focus();
});

el("sizes").addEventListener("click", e => {
  const btn = e.target.closest(".size");
  if (btn){ sizeN = Number(btn.dataset.size); savePrefs(); newGame(); }
});
el("decks").addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (btn){ deckId = btn.dataset.deck; savePrefs(); newGame(); }
});
el("peekToggle").addEventListener("click", () => {
  peekOn = !peekOn;
  savePrefs();
  newGame();
});
el("shuffle").addEventListener("click", newGame);
el("again").addEventListener("click", newGame);
el("share").addEventListener("click", shareResult);
el("veil").addEventListener("click", () => setPaused(false));
el("pause").addEventListener("click", () => setPaused(!paused));
el("sound").addEventListener("click", () => { Sound.toggle(); paintSound(); });

document.addEventListener("keydown", e => {
  if (e.target.closest(".scene")) return;         // let the grid handle its own keys
  const k = e.key.toLowerCase();
  if (peeking && (e.key === " " || e.key === "Enter" || e.key === "Escape")) { e.preventDefault(); endPeek(); return; }
  if (e.key === "Escape" || k === "p") setPaused(!paused);
  else if (k === "n") newGame();
  else if (k === "m") { Sound.toggle(); paintSound(); }
});

/* auto-pause when the game leaves the screen */
document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

/* keep the board inside the viewport on every layout change */
window.addEventListener("resize", queueFit, { passive:true });
window.addEventListener("orientationchange", () => setTimeout(fitBoard, 250));
if (window.visualViewport) window.visualViewport.addEventListener("resize", queueFit, { passive:true });
window.addEventListener("load", fitBoard);

/* ---------------- go ---------------- */

el("pause").innerHTML = ICON_PAUSE;
el("pause").setAttribute("aria-label", "Pause game");
el("share").innerHTML = ICON_CHAT + "<span>Share on WhatsApp</span>";
paintSound();
newGame();
</script>
</body>
</html>
