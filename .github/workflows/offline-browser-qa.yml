name: Mirrorwork full offline browser acceptance

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tools/qa-browser.js
      - .github/workflows/offline-browser-qa.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QA script syntax
        run: node --check tools/qa-browser.js
      - name: Install isolated Chromium test runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - name: Install Chromium headless browser
        run: npx playwright install --with-deps chromium
      - name: Verify five decks, size rules, complete game, saved progress and device layouts
        run: node tools/qa-browser.js
